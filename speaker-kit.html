<script>
/* Set before the loader can paint, so a repeat page hides it with no flash.
   sessionStorage, not localStorage: once per visit, and a person coming back
   tomorrow gets the loader again. try/catch because storage throws outright
   in some privacy modes. */
try{ if(sessionStorage.getItem('am-seen')) document.documentElement.className += ' seen'; }catch(e){}
</script>
<style>
/* Loader. Timed entirely in CSS — if the JS never runs, or throws, the page
   still uncovers itself on schedule. */
html.seen #load{ display:none }
#load{
  position:fixed; inset:0; z-index:9999; background:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
  animation:ldOut .5s cubic-bezier(.16,1,.3,1) 1.85s forwards;
}
#load .ld-lens{ position:relative; width:104px; height:104px; display:grid; place-items:center; }
#load .ld-lens b{ position:absolute; width:17px; height:17px; border:2px solid #0572E9; }
#load .ld-lens b:nth-child(1){ top:0; left:0; border-right:0; border-bottom:0 }
#load .ld-lens b:nth-child(2){ top:0; right:0; border-left:0; border-bottom:0 }
#load .ld-lens b:nth-child(3){ bottom:0; right:0; border-left:0; border-top:0 }
#load .ld-lens b:nth-child(4){ bottom:0; left:0; border-right:0; border-top:0 }
#load .ld-sweep{
  position:absolute; left:9%; right:9%; top:0; height:1.5px;
  background:linear-gradient(90deg,transparent,#0572E9,transparent);
  z-index:2; animation:ldSweep 1.15s ease-in-out infinite;
}
#load img{ width:42px; height:auto; }
#load .ld-bar{ width:132px; height:2px; border-radius:2px; background:rgba(5,114,233,.16); overflow:hidden; }
#load .ld-bar i{ display:block; height:100%; width:0; background:#0572E9; animation:ldFill 1.85s cubic-bezier(.45,0,.15,1) forwards; }
@keyframes ldSweep{ 0%,100%{ top:4%; opacity:0 } 14%,86%{ opacity:1 } 50%{ top:calc(96% - 1.5px) } }
@keyframes ldFill{ to{ width:100% } }
@keyframes ldOut{ to{ opacity:0; visibility:hidden; pointer-events:none } }
@media(prefers-reduced-motion:reduce){
  #load{ animation-delay:.2s }
  #load .ld-sweep{ animation:none; top:50%; opacity:.5 }
  #load .ld-bar i{ animation-duration:.2s }
}
</style>
</head>
<body>

<div id="load" aria-hidden="true">
  <div class="ld-lens">
    <b></b><b></b><b></b><b></b>
    <i class="ld-sweep"></i>
    <img src="assets/ui/logo-mark.png" alt="">
  </div>
  <div class="ld-bar"><i></i></div>
</div>

<script>
/* The CSS animation does the fade, but animations are paused in a hidden tab.
   A timer still fires there, so this guarantees the loader is gone either way.
   Inline and immediate, so it does not wait on v2.js. */
try{ sessionStorage.setItem('am-seen','1'); }catch(e){}
setTimeout(function(){ var l = document.getElementById('load'); if (l) l.remove(); }, 2400);
</script>
